name: publish

# Builds and pushes the stdio MCP image to GHCR, then publishes the registry
# entry for the same version. Runs on every push to main, weekly (self-heal),
# and on demand.
#
# The image tag and the registry version both come from the currently-served
# CLI version (https://simpletel.dev/static/bin/VERSION), sanitized into a
# legal Docker tag ('+' -> '-').

on:
  push:
    branches: [main]
  schedule:
    # Weekly self-heal: the CLI version moves with every push to the private
    # mono-repo, and both the image tag and the registry entry derive from it.
    # A run at an unchanged version is harmless — the image rebuild is
    # idempotent and the duplicate registry publish is non-fatal.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write     # push ghcr.io/willnewby/simpletel-mcp
  id-token: write     # mcp-publisher login github-oidc

env:
  IMAGE: ghcr.io/willnewby/simpletel-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the current CLI version
        id: ver
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://simpletel.dev/static/bin/VERSION)"
          case "$version" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9][0-9][0-9][0-9].[0-9][0-9]+*) ;;
            *) echo "::error::unexpected VERSION from simpletel.dev: $version"; exit 1 ;;
          esac
          tag="$(printf '%s' "$version" | tr '+' '-')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE:$tag (CLI $version)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:latest

  register:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Point server.json at the built image
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]
          with open("server.json") as f:
              d = json.load(f)
          d["version"] = tag
          for p in d.get("packages", []):
              if p.get("registryType") == "oci":
                  repo = p["identifier"].rsplit(":", 1)[0]
                  p["identifier"] = f"{repo}:{tag}"
          with open("server.json", "w") as f:
              json.dump(d, f, indent=2)
              f.write("\n")
          PY
          cat server.json

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Authenticate to the MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      # The registry pulls the OCI image anonymously to check the
      # `io.modelcontextprotocol.server.name` label, so this step fails until
      # the GHCR package is public. It is non-fatal: the image is what matters,
      # and the manual follow-up is printed below.
      - name: Publish to the MCP registry
        id: publish
        continue-on-error: true
        run: ./mcp-publisher publish

      - name: Manual follow-up (only if registry publish failed)
        if: steps.publish.outcome == 'failure'
        run: |
          cat <<'EOF'
          ::warning::Registry publish failed. This is usually one of:
            1. The GHCR package is still private. Make it public once:
                 gh api --method PATCH /user/packages/container/simpletel-mcp -f visibility=public
               (or GitHub -> your profile -> Packages -> simpletel-mcp -> Package settings -> Change visibility)
            2. The version was already published. Bump the CLI (push to main) and re-run.
          Then publish manually from a checkout:
                 brew install mcp-publisher
                 mcp-publisher login github --token "$(gh auth token)"
                 mcp-publisher publish
          EOF
